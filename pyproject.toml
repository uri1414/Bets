[project]
name = "prop-engine"
version = "0.1.0"
description = "NFL player-prop engine: sharp-market prior vs Underdog lines (see docs/SPEC.md)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "httpx>=0.27",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prop-engine = "prop_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prop_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
